<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>BNF Tower Explorer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d2327; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1d2327; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #e6ece8; }
    #loading .title { font-size: 18px; font-weight: 600; }
    #loading .sub { font-size: 13px; color: #9fb0a8; }
    #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #33403b; overflow: hidden; }
    #bar-fill { width: 0%; height: 100%; background: #6fbf73; transition: width .2s; }
    #error { display: none; max-width: 520px; padding: 0 16px; text-align: center; color: #ffb4a8; font-size: 14px; }
    #nav { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; }
    #nav a { font-size: 12px; color: #e6ece8; text-decoration: none; background: rgba(20, 26, 29, .72); padding: 5px 9px; border-radius: 4px; }
    #nav a:hover { background: rgba(20, 26, 29, .92); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="title" id="view-title">BNF Tower Explorer</div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div class="sub" id="status">Loading the 3D model...</div>
    <div id="error"></div>
  </div>
  <nav id="nav">
    <a href="../">All views</a>
    <a id="switch" href="#"></a>
  </nav>
  <script>
    // This one template serves both builds (s10/ and full/); link to the other one.
    (function () {
      var inFull = /\/full\/?(index\.html)?$/.test(location.pathname);
      var a = document.getElementById("switch");
      a.href = inFull ? "../s10/" : "../full/";
      a.textContent = inFull ? "Switch to S10 tower site" : "Switch to full domain";
      var name = inFull ? "Full domain" : "S10 tower site";
      document.title = "BNF Tower Explorer: " + name;
      document.getElementById("view-title").textContent = "BNF Tower Explorer: " + name;
    })();
  </script>
  <script src="Build/s10.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      arguments: [],
      dataUrl: "Build/s10.data.unityweb",
      frameworkUrl: "Build/s10.framework.js.unityweb",
      codeUrl: "Build/s10.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BNF",
      productVersion: "1.0",
      // Cap the resolution on high-DPI phones and laptops so the forest stays smooth.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    function showError(msg) {
      document.getElementById("bar").style.display = "none";
      document.getElementById("status").style.display = "none";
      var e = document.getElementById("error");
      e.style.display = "block";
      e.textContent = msg;
    }

    createUnityInstance(canvas, config, function (progress) {
      document.getElementById("bar-fill").style.width = Math.round(100 * progress) + "%";
      if (progress >= 0.9) document.getElementById("status").textContent = "Starting...";
    }).then(function () {
      document.getElementById("loading").style.display = "none";
      canvas.focus();
    }).catch(function (message) {
      showError("The viewer couldn't start: " + message +
        " It needs a browser with WebGL 2 (a recent Chrome, Firefox, Safari or Edge).");
    });
  </script>
</body>
</html>
